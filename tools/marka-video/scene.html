<script>
const D=12000,$=id=>document.getElementById(id);
const E=(el,kf,o={})=>{const ez=o.easing||'cubic-bezier(.22,1,.36,1)';return el.animate(kf.map(k=>({easing:ez,...k})),{duration:D,iterations:Infinity,fill:'both',easing:'linear'})};
const ease='cubic-bezier(.22,1,.36,1)';
// word letters
'BARVION'.split('').forEach((c,i)=>{const s=document.createElement('span');s.textContent=c;$('word').appendChild(s);
 const a=1.5+i*.08,b=a+.7;
 E(s,[{offset:0,opacity:0,transform:'translateY(60px) scale(1.3)',filter:'blur(18px)'},{offset:a/12,opacity:0,transform:'translateY(60px) scale(1.3)',filter:'blur(18px)'},{offset:b/12,opacity:1,transform:'none',filter:'blur(0)'},{offset:.26,opacity:1,transform:'none'},{offset:.31,opacity:0,transform:'translateY(-30px)'},{offset:.93,opacity:0},{offset:1,opacity:0,transform:'translateY(60px) scale(1.3)',filter:'blur(18px)'}],{easing:'linear'})});
E($('tag'),[{offset:0,opacity:0},{offset:.17,opacity:0},{offset:.22,opacity:1},{offset:.26,opacity:1},{offset:.3,opacity:0},{offset:1,opacity:0}],{easing:'linear'});
// background drift
E($('grid'),[{transform:'translate(0,0)'},{transform:'translate(-80px,-80px)'}],{easing:'linear'});
E($('o1'),[{transform:'translate(0,0)'},{transform:'translate(300px,-120px)'},{transform:'translate(0,0)'}],{easing:'ease-in-out'});
E($('o2'),[{transform:'translate(0,0)'},{transform:'translate(-260px,160px)'},{transform:'translate(0,0)'}],{easing:'ease-in-out'});
// mark: draw -> fill -> move left-top -> stay small -> return
E($('ring'),[{offset:0,strokeDashoffset:1},{offset:.12,strokeDashoffset:0},{offset:1,strokeDashoffset:0}],{easing:'ease-in-out'});
E($('bdraw'),[{offset:.05,strokeDashoffset:1},{offset:.15,strokeDashoffset:0,opacity:1},{offset:.19,opacity:0},{offset:1,opacity:0}],{easing:'ease-in-out'});
E($('bb'),[{offset:0,opacity:0},{offset:.15,opacity:0},{offset:.19,opacity:1},{offset:1,opacity:1}],{easing:'linear'});
E($('mark'),[{offset:0,transform:'scale(.6) rotate(-30deg)',opacity:0},{offset:.06,transform:'scale(1) rotate(0)',opacity:1},{offset:.3,transform:'translate(0,0) scale(1)'},{offset:.4,transform:'translate(-660px,-300px) scale(.42)'},{offset:.86,transform:'translate(-660px,-300px) scale(.42)'},{offset:.94,transform:'translate(-660px,-300px) scale(.42)',opacity:1},{offset:.97,transform:'translate(0,0) scale(1)',opacity:1},{offset:1,transform:'scale(.6) rotate(-30deg)',opacity:0}]);
E($('o1'),[{opacity:.35},{opacity:.35}]);
// swatches
const cols=['#2358D6','#57C9E9','#0B2347','#F2F4F6','#FF8A3D'],names=['#2358D6','#57C9E9','#0B2347','#F2F4F6','#FF8A3D'];
cols.forEach((c,i)=>{const d=document.createElement('div');d.className='abs sw';d.style.background=c;d.style.left=(150+i*190)+'px';d.style.top='330px';d.innerHTML='<b>'+names[i]+'</b>';$('sws').appendChild(d);
 const a=(3.5+i*.18)/12;
 E(d,[{offset:0,opacity:0,transform:'scale(0) translateY(80px)'},{offset:a,opacity:0,transform:'scale(0) translateY(80px)'},{offset:a+.05,opacity:1,transform:'scale(1.12) translateY(0)'},{offset:a+.07,transform:'scale(1)'},{offset:.66,opacity:1,transform:'scale(1) translateY(0)'},{offset:.72,opacity:0,transform:'scale(.7) translateY(-40px)'},{offset:1,opacity:0}],{easing:'linear'})});
const fi=(el,s,e,from,to='none',extra={})=>E(el,[{offset:0,opacity:0,transform:from},{offset:s/12,opacity:0,transform:from},{offset:(s+.9)/12,opacity:1,transform:to},{offset:(e-.6)/12,opacity:1,transform:to},{offset:e/12,opacity:0,transform:from},{offset:1,opacity:0}],{easing:'linear',...extra});
fi($('tl2'),3.6,8,'translateY(30px)');fi($('aa'),4.6,8,'translateY(80px) scale(.8)');fi($('tl1'),5,8,'translateY(30px)');
// mockups (6.6 - 11.2) floating
const mk=(id,l,t,r,s,e,fx,fy)=>{const el=$(id);el.style.left=l+'px';el.style.top=t+'px';
 const T=(x,y,rr,sc)=>`translate(${x}px,${y}px) rotate(${rr}deg) scale(${sc})`;
 E(el,[{offset:0,opacity:0,transform:T(fx,fy,r+14,.7)},{offset:s/12,opacity:0,transform:T(fx,fy,r+14,.7)},{offset:(s+.9)/12,opacity:1,transform:T(0,0,r,1)},{offset:((s+e)/2)/12,opacity:1,transform:T(14,-18,r+1.5,1.02)},{offset:(e-.7)/12,opacity:1,transform:T(0,0,r,1)},{offset:e/12,opacity:0,transform:T(-fx*.5,-fy*.5,r-10,.8)},{offset:1,opacity:0}],{easing:'linear'})};
mk('c4',1020,120,-3,6.4,11.3,300,-300);
mk('c1',140,560,-8,6.8,11.3,-300,300);
mk('c2',300,500,5,7.1,11.3,-200,400);
mk('c3',1100,540,6,7.4,11.3,400,200);
mk('c5',820,560,-4,7.7,11.3,0,500);
[['ch1',470,230,6.9],['ch2',520,130,7.2],['ch3',1320,90,7.5],['ch4',760,80,7.8],['ch5',1580,420,8.1]].forEach(([id,l,t,s])=>{const el=$(id);el.style.left=l+'px';el.style.top=t+'px';
 E(el,[{offset:0,opacity:0,transform:'translateY(40px)'},{offset:s/12,opacity:0,transform:'translateY(40px)'},{offset:(s+.6)/12,opacity:1,transform:'none'},{offset:((s+10.8)/2)/12,transform:'translateY(-12px)'},{offset:10.7/12,opacity:1,transform:'none'},{offset:11.2/12,opacity:0},{offset:1,opacity:0}],{easing:'linear'})});
document.getAnimations().forEach(a=>a.pause());
window.seek=t=>{document.getAnimations().forEach(a=>{a.currentTime=t})};
</script></body></html>
